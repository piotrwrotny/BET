name: Publish AI Toolkit

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "packages/ai-toolkit/**"
      - ".github/workflows/publish-ai-toolkit.yml"

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ai-toolkit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bet-team"

      - name: Validate package metadata
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.name) throw new Error('Missing name');
            if (!pkg.version) throw new Error('Missing version');
            if (pkg.publishConfig?.registry !== 'https://npm.pkg.github.com') throw new Error('Missing publishConfig.registry');
            console.log('package.json OK:', pkg.name, pkg.version);
          "

      - name: Validate rules file
        run: |
          node -e "
            const fs = require('fs');
            const rules = fs.readFileSync('./rules/AGENTS.md', 'utf8');
            if (!rules.includes('<!-- BEGIN @bet-team/ai-toolkit -->')) throw new Error('Missing sentinel markers');
            console.log('rules/AGENTS.md OK');
          "

      - name: Dry-run pack
        run: npm pack --dry-run

  publish:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ai-toolkit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bet-team"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "Tag matches version: $VERSION"

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
