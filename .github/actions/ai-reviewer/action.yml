name: AI Code Reviewer
branding:
  icon: check-circle
  color: purple
description: Runs the local AI review agent and posts the result as a PR comment + label.

inputs:
  api-key:
    description: API key for the LLM provider.
    required: true
  base-url:
    description: Optional base URL for the LLM provider.
    required: false
  model:
    description: Model identifier.
    required: false
    default: moonshotai/Kimi-K2.7-Code
  provider:
    description: Provider name (gucio or openrouter).
    required: false
    default: gucio
  pr-title:
    description: Pull request title.
    required: false
  pr-body:
    description: Pull request body.
    required: false
  diff:
    description: Git diff to review.
    required: true

outputs:
  verdict:
    description: pass or fail from the reviewer.
    value: ${{ steps.review.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Run review agent
      id: review
      shell: bash
      env:
        LLM_PROVIDER: ${{ inputs.provider }}
        LLM_BASE_URL: ${{ inputs.base-url }}
        LLM_API_KEY: ${{ inputs.api-key }}
        LLM_MODEL: ${{ inputs.model }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        DIFF: ${{ inputs.diff }}
      run: |
        set -e
        npx tsx "${{ github.workspace }}/scripts/review.ts" > "$RUNNER_TEMP/review.json"
        cat "$RUNNER_TEMP/review.json"
        verdict=$(jq -r '.verdict' "$RUNNER_TEMP/review.json")
        echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        jq -r '.summary' "$RUNNER_TEMP/review.json" > "$RUNNER_TEMP/review-comment.md"
        {
          echo "## AI Code Review"
          echo ""
          cat "$RUNNER_TEMP/review-comment.md"
          echo ""
          echo "Verdict: **$(jq -r '.verdict' "$RUNNER_TEMP/review.json")**"
        } > "$RUNNER_TEMP/pr-comment.md"
        gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/pr-comment.md"

    - name: Label PR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        verdict=$(jq -r '.verdict' "$RUNNER_TEMP/review.json")
        if [ "$verdict" = "pass" ]; then
          gh pr edit "${{ github.event.pull_request.number }}" --add-label "ai-cr:passed" --remove-label "ai-cr:failed" || true
        else
          gh pr edit "${{ github.event.pull_request.number }}" --add-label "ai-cr:failed" --remove-label "ai-cr:passed" || true
        fi
