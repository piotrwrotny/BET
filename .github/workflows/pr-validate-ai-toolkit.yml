name: Validate AI Toolkit

on:
  pull_request:
    paths:
      - "packages/ai-toolkit/**"
      - ".github/workflows/pr-validate-ai-toolkit.yml"
  push:
    branches:
      - master
      - dev
      - "module-5*"
    paths:
      - "packages/ai-toolkit/**"
      - ".github/workflows/pr-validate-ai-toolkit.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ai-toolkit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Validate package metadata
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.name) throw new Error('Missing name');
            if (!pkg.version) throw new Error('Missing version');
            if (pkg.publishConfig?.registry !== 'https://npm.pkg.github.com') throw new Error('Missing publishConfig.registry');
            console.log('package.json OK:', pkg.name, pkg.version);
          "

      - name: Validate rules artifact
        run: |
          node -e "
            const fs = require('fs');
            const rules = fs.readFileSync('./rules/AGENTS.md', 'utf8');
            if (!rules.trim()) throw new Error('Empty rules file');
            console.log('rules/AGENTS.md OK');
          "

      - name: Run tests
        run: npm test

      - name: Dry-run pack
        run: npm pack --dry-run
